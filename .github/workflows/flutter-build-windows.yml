name: Build RustDesk Windows x64 (Sciter) with custom server ID & key

on:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
      - '**.rs'
      - 'Cargo.*'
      - 'libs/**'
      - 'src/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEFAULT_RENDEZVOUS_SERVER: ${{ secrets.RS_SERVER_ID }}.tld
  DEFAULT_RS_PUB_KEY: ${{ secrets.RS_SERVER_KEY }}
  DEFAULT_RELAY_SERVER: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-x64:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    
    steps:
      - name: Checkout (submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      
      - name: Enable Flutter Windows desktop
        run: |
          flutter config --enable-windows-desktop
          flutter --version
          flutter doctor -v

      - name: Install LLVM/Clang (for bindgen)
        run: |
          Write-Host "========================================"
          Write-Host "Installing LLVM/Clang for bindgen"
          Write-Host "========================================"
          
          $installed = $false
          
          Write-Host "Checking if LLVM is already installed..."
          $possiblePaths = @(
            "C:\Program Files\LLVM\bin\clang.exe",
            "C:\Program Files (x86)\LLVM\bin\clang.exe",
            "$env:ProgramFiles\LLVM\bin\clang.exe"
          )
          
          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              Write-Host "Found existing LLVM at: $path"
              $llvmDir = Split-Path $path -Parent
              echo "LIBCLANG_PATH=$llvmDir" | Out-File -FilePath $env:GITHUB_ENV -Append
              echo $llvmDir | Out-File -FilePath $env:GITHUB_PATH -Append
              $installed = $true
              break
            }
          }
          
          if (-not $installed) {
            Write-Host "LLVM not found, trying winget installation..."
            try {
              winget install --id LLVM.LLVM -e --source winget --accept-package-agreements --silent --accept-source-agreements
              Start-Sleep -Seconds 10
              
              if (Test-Path "C:\Program Files\LLVM\bin\clang.exe") {
                Write-Host "LLVM installed successfully via winget"
                echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
                echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
                $installed = $true
              }
            } catch {
              Write-Host "Winget installation failed: $_"
            }
          }
          
          if (-not $installed) {
            Write-Host "Trying direct download from GitHub releases..."
            $llvmVersion = "17.0.6"
            $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/LLVM-$llvmVersion-win64.exe"
            $installer = "$env:TEMP\LLVM-$llvmVersion-win64.exe"
            
            try {
              Write-Host "Downloading LLVM from: $llvmUrl"
              Invoke-WebRequest -Uri $llvmUrl -OutFile $installer -UseBasicParsing -TimeoutSec 300
              
              Write-Host "Installing LLVM silently..."
              Start-Process -FilePath $installer -ArgumentList "/S" -Wait -NoNewWindow
              Start-Sleep -Seconds 15
              
              if (Test-Path "C:\Program Files\LLVM\bin\clang.exe") {
                Write-Host "LLVM installed successfully via direct download"
                echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
                echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
                $installed = $true
              }
            } catch {
              Write-Host "Direct download failed: $_"
            }
          }
          
          if (-not $installed) {
            Write-Host "::error::Failed to install LLVM/Clang"
            exit 1
          }
          
          & "C:\Program Files\LLVM\bin\clang.exe" --version
          Write-Host "========================================"

      - name: Install vcpkg dependencies (Fixed for libvpx)
        run: |
          Write-Host "========================================"
          Write-Host "Installing vcpkg and dependencies"
          Write-Host "========================================"
          
          git --version
          
          # Configure git for better performance
          git config --global http.postBuffer 524288000
          git config --global core.compression 0
          
          $vcpkgDir = "$env:USERPROFILE\vcpkg"
          
          # Remove existing vcpkg if it exists
          if (Test-Path $vcpkgDir) {
            Write-Host "Removing existing vcpkg directory..."
            Remove-Item -Path $vcpkgDir -Recurse -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }
          
          # Clone vcpkg with depth 1
          Write-Host "Cloning vcpkg (this may take a moment)..."
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgDir
          
          if (-not (Test-Path "$vcpkgDir\bootstrap-vcpkg.bat")) {
            Write-Host "::error::Failed to clone vcpkg repository"
            exit 1
          }
          
          # Bootstrap vcpkg
          Write-Host "Bootstrapping vcpkg..."
          Push-Location $vcpkgDir
          try {
            .\bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::vcpkg bootstrap failed with exit code: $LASTEXITCODE"
              exit $LASTEXITCODE
            }
          } finally {
            Pop-Location
          }
          
          if (-not (Test-Path "$vcpkgDir\vcpkg.exe")) {
            Write-Host "::error::vcpkg.exe not found after bootstrap"
            exit 1
          }
          
          # Set environment variables
          echo "VCPKG_ROOT=$vcpkgDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$vcpkgDir" | Out-File -FilePath $env:GITHUB_PATH -Append
          
          # Install required packages with retry logic and specific versions
          $packages = @(
            'libvpx:x64-windows-static',
            'libyuv:x64-windows-static',
            'opus:x64-windows-static',
            'aom:x64-windows-static'
          )
          
          function Install-VcpkgPackage {
            param($package)
            $maxRetries = 3
            $retryDelay = 10
            
            for ($i = 1; $i -le $maxRetries; $i++) {
              Write-Host "Installing $package (Attempt $i of $maxRetries)..."
              
              # Add timeout and disable parallel build to avoid issues
              & "$vcpkgDir\vcpkg.exe" install $package --recurse --clean-after-build
              
              if ($LASTEXITCODE -eq 0) {
                Write-Host "Successfully installed $package"
                return $true
              } else {
                Write-Host "Failed to install $package. Exit code: $LASTEXITCODE"
                if ($i -lt $maxRetries) {
                  Write-Host "Retrying in $retryDelay seconds..."
                  Start-Sleep -Seconds $retryDelay
                  # Clean up partial installations
                  & "$vcpkgDir\vcpkg.exe" remove $package --recurse 2>$null
                }
              }
            }
            return $false
          }
          
          # Install packages one by one
          foreach ($pkg in $packages) {
            $success = Install-VcpkgPackage $pkg
            if (-not $success) {
              Write-Host "::error::Failed to install $pkg after multiple attempts"
              exit 1
            }
          }
          
          # Verify installations
          Write-Host "Verifying installed packages..."
          & "$vcpkgDir\vcpkg.exe" list
          
          Write-Host "vcpkg dependencies installed successfully"
          Write-Host "========================================"

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
            cargo-

      - name: Cache vcpkg installed
        uses: actions/cache@v4
        with:
          path: ${{ env.USERPROFILE }}\vcpkg\installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('.github/workflows/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Download Sciter DLL
        run: |
          New-Item -ItemType Directory -Force -Path target\release | Out-Null
          Write-Host "Downloading Sciter DLL..."
          $sciterUrl = "https://raw.githubusercontent.com/c-smile/sciter-sdk/master/bin.win/x64/sciter.dll"
          $sciterPath = "target\release\sciter.dll"
          
          try {
            Invoke-WebRequest -UseBasicParsing -Uri $sciterUrl -OutFile $sciterPath -TimeoutSec 60
            if ((Get-Item $sciterPath).Length -gt 0) {
              Write-Host "Sciter DLL downloaded successfully"
            } else {
              Write-Host "Sciter DLL file is empty"
            }
          } catch {
            Write-Host "Failed to download Sciter DLL: $_"
          }

      - name: Set custom server ID/Key/Relay from Secrets
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          RELAY_SERVER: ${{ secrets.RELAY_SERVER }}
        run: |
          if (-not $env:RENDEZVOUS_SERVER) { $env:RENDEZVOUS_SERVER = $env:DEFAULT_RENDEZVOUS_SERVER }
          if (-not $env:RS_PUB_KEY) { $env:RS_PUB_KEY = $env:DEFAULT_RS_PUB_KEY }
          if (-not $env:RELAY_SERVER) { $env:RELAY_SERVER = $env:DEFAULT_RELAY_SERVER }
          
          Write-Host "Using RENDEZVOUS_SERVER: $env:RENDEZVOUS_SERVER"
          Write-Host "Using RELAY_SERVER: $env:RELAY_SERVER"
          
          $configFiles = @()
          if (Test-Path "libs") {
            $configFiles += Get-ChildItem -Recurse -File -Path libs -Filter config.rs -ErrorAction SilentlyContinue
          }
          if (Test-Path "src") {
            $configFiles += Get-ChildItem -Recurse -File -Path src -Filter config.rs -ErrorAction SilentlyContinue
          }
          
          if ($configFiles.Count -eq 0) {
            Write-Host "No config.rs files found. Creating default config.rs"
            New-Item -ItemType Directory -Force -Path "src" | Out-Null
            
            $defaultConfigLine1 = "// Auto-generated configuration"
            $defaultConfigLine2 = "pub const DEFAULT_RENDEZVOUS_SERVER: &str = `"$($env:RENDEZVOUS_SERVER)`";"
            $defaultConfigLine3 = "pub const DEFAULT_RS_PUB_KEY: &str = `"$($env:RS_PUB_KEY)`";"
            $defaultConfigLine4 = "pub const DEFAULT_RELAY_SERVER: &str = `"$($env:RELAY_SERVER)`";"
            
            $defaultConfig = "$defaultConfigLine1`n$defaultConfigLine2`n$defaultConfigLine3`n$defaultConfigLine4"
            Set-Content -Path "src\config.rs" -Value $defaultConfig -Encoding UTF8
            Write-Host "Created default config.rs"
          } else {
            foreach ($configFile in $configFiles) {
              Write-Host "Updating: $($configFile.FullName)"
              $content = Get-Content $configFile.FullName -Raw -Encoding UTF8
              
              $regex1 = '(?m)^(\s*pub\s+const\s+DEFAULT_RENDEZVOUS_SERVER\s*:\s*&str\s*=\s*)"[^"]*"'
              $content = $content -replace $regex1, "`$1`"$env:RENDEZVOUS_SERVER`""
              
              $regex2 = '(?m)^(\s*pub\s+const\s+DEFAULT_RS_PUB_KEY\s*:\s*&str\s*=\s*)"[^"]*"'
              $content = $content -replace $regex2, "`$1`"$env:RS_PUB_KEY`""
              
              $regex3 = '(?m)^(\s*pub\s+const\s+DEFAULT_RELAY_SERVER\s*:\s*&str\s*=\s*)"[^"]*"'
              $content = $content -replace $regex3, "`$1`"$env:RELAY_SERVER`""
              
              Set-Content $configFile.FullName $content -Encoding UTF8 -NoNewline
              Write-Host "Updated: $($configFile.Name)"
            }
          }

      - name: Build RustDesk (release, x64)
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}
          VCPKGRS_DYNAMIC: 0
        run: |
          Write-Host "========================================"
          Write-Host "Starting build process"
          Write-Host "========================================"
          Write-Host "VCPKG_ROOT: $env:VCPKG_ROOT"
          Write-Host "LIBCLANG_PATH: $env:LIBCLANG_PATH"
          
          if ($env:VCPKG_ROOT) {
            $env:Path = "$env:VCPKG_ROOT;$env:Path"
          }
          
          Write-Host "Building RustDesk..."
          cargo build --release --target x86_64-pc-windows-msvc
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Build failed with exit code: $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          
          $exePath = "target\x86_64-pc-windows-msvc\release\rustdesk.exe"
          if (Test-Path $exePath) {
            $fileSize = [math]::Round((Get-Item $exePath).Length/1MB, 2)
            Write-Host "Build completed successfully!"
            Write-Host "Executable size: $fileSize MB"
          } else {
            Write-Host "::error::Build completed but executable not found at $exePath"
            exit 1
          }
          
          Write-Host "========================================"

      - name: Rename binary with custom server info
        if: success()
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER || env.DEFAULT_RENDEZVOUS_SERVER }}
        run: |
          $exePath = "target\x86_64-pc-windows-msvc\release\rustdesk.exe"
          if (Test-Path $exePath) {
            $safeHost = ($env:RENDEZVOUS_SERVER -replace '[^a-zA-Z0-9.-]', '-')
            $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
            $outName = "rustdesk-host=$safeHost-$timestamp.exe"
            Copy-Item $exePath $outName
            Write-Host "Created: $outName"
          }

      - name: List build artifacts
        if: success()
        run: |
          Write-Host "========================================"
          Write-Host "Build Artifacts"
          Write-Host "========================================"
          
          $artifacts = @(
            "target\x86_64-pc-windows-msvc\release\rustdesk.exe",
            "target\release\sciter.dll"
          )
          
          foreach ($artifact in $artifacts) {
            if (Test-Path $artifact) {
              $file = Get-Item $artifact
              $size = [math]::Round($file.Length/1MB, 2)
              Write-Host "$($file.Name): $size MB"
            }
          }
          
          Get-ChildItem "rustdesk-host=*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            $size = [math]::Round($_.Length/1MB, 2)
            Write-Host "$($_.Name): $size MB"
          }
          
          Write-Host "========================================"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64-custom
          path: |
            target\x86_64-pc-windows-msvc\release\rustdesk.exe
            rustdesk-host=*.exe
            target\release\sciter.dll
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
