name: Build RustDesk Windows x64 (Sciter) with custom server ID & key

on:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
      - '**.rs'
      - 'Cargo.*'
      - 'libs/**'
      - 'src/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

env:
  DEFAULT_RENDEZVOUS_SERVER: ${{ secrets.RS_SERVER_ID }}.tld
  DEFAULT_RS_PUB_KEY: ${{ secrets.RS_SERVER_KEY }}
  DEFAULT_RELAY_SERVER: ""
  # Force Node.js 24 to eliminate deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-x64:
    runs-on: windows-2022  # Stable version, not windows-latest
    defaults:
      run:
        shell: pwsh
    
    steps:
      - name: Checkout (submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      
      - name: Enable Flutter Windows desktop
        run: |
          flutter config --enable-windows-desktop
          flutter --version
          flutter doctor -v

      - name: Install LLVM/Clang (for bindgen)
        run: |
          Write-Host "========================================"
          Write-Host "Installing LLVM/Clang for bindgen"
          Write-Host "========================================"
          
          $installed = $false
          
          # Method 1: Check if already installed on runner
          Write-Host "Checking if LLVM is already installed..."
          $possiblePaths = @(
            "C:\Program Files\LLVM\bin\clang.exe",
            "C:\Program Files (x86)\LLVM\bin\clang.exe",
            "$env:ProgramFiles\LLVM\bin\clang.exe"
          )
          
          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              Write-Host "✅ Found existing LLVM at: $path"
              $llvmDir = Split-Path $path -Parent
              echo "LIBCLANG_PATH=$llvmDir" | Out-File -FilePath $env:GITHUB_ENV -Append
              echo $llvmDir | Out-File -FilePath $env:GITHUB_PATH -Append
              $installed = $true
              break
            }
          }
          
          # Method 2: Try using winget (more reliable than choco)
          if (-not $installed) {
            Write-Host "LLVM not found, trying winget installation..."
            try {
              winget install --id LLVM.LLVM -e --source winget --accept-package-agreements --silent --accept-source-agreements
              
              # Wait for installation to complete
              Start-Sleep -Seconds 10
              
              if (Test-Path "C:\Program Files\LLVM\bin\clang.exe") {
                Write-Host "✅ LLVM installed successfully via winget"
                echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
                echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
                $installed = $true
              } else {
                Write-Host "⚠️ Winget installation completed but LLVM not found"
              }
            } catch {
              Write-Host "⚠️ Winget installation failed: $_"
            }
          }
          
          # Method 3: Direct download from GitHub
          if (-not $installed) {
            Write-Host "Trying direct download from GitHub releases..."
            $llvmVersion = "17.0.6"
            $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/LLVM-$llvmVersion-win64.exe"
            $installer = "$env:TEMP\LLVM-$llvmVersion-win64.exe"
            
            try {
              Write-Host "Downloading LLVM from: $llvmUrl"
              Invoke-WebRequest -Uri $llvmUrl -OutFile $installer -UseBasicParsing -TimeoutSec 300
              
              Write-Host "Installing LLVM silently..."
              Start-Process -FilePath $installer -ArgumentList "/S" -Wait -NoNewWindow
              
              # Wait for installation to complete
              Start-Sleep -Seconds 15
              
              if (Test-Path "C:\Program Files\LLVM\bin\clang.exe") {
                Write-Host "✅ LLVM installed successfully via direct download"
                echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
                echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
                $installed = $true
              } else {
                Write-Host "❌ Direct download installation failed"
              }
            } catch {
              Write-Host "❌ Direct download failed: $_"
            }
          }
          
          # Verify installation
          Write-Host "========================================"
          Write-Host "Verifying LLVM installation"
          Write-Host "========================================"
          
          $clangPaths = @(
            "C:\Program Files\LLVM\bin\clang.exe",
            "$env:LIBCLANG_PATH\clang.exe"
          )
          
          $clangFound = $false
          foreach ($path in $clangPaths) {
            if (Test-Path $path) {
              Write-Host "✅ Clang found at: $path"
              & $path --version
              $clangFound = $true
              break
            }
          }
          
          if (-not $clangFound) {
            Write-Host "❌ Clang not found after all installation attempts"
            Write-Host "Checking if clang is in PATH..."
            try {
              clang --version
              $clangFound = $true
            } catch {
              Write-Host "❌ Clang not available in PATH either"
            }
          }
          
          if (-not $clangFound) {
            Write-Host "::error::Failed to install LLVM/Clang"
            exit 1
          }
          
          Write-Host "========================================"
          Write-Host "LLVM/Clang installation completed"
          Write-Host "========================================"

      - name: Install Git & vcpkg dependencies
        run: |
          Write-Host "Installing vcpkg and dependencies..."
          git --version
          
          if (-not (Test-Path "$env:USERPROFILE\vcpkg")) {
            git clone https://github.com/microsoft/vcpkg $env:USERPROFILE\vcpkg
          }
          
          if (-not (Test-Path "$env:USERPROFILE\vcpkg\vcpkg.exe")) {
            & $env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat
          }
          
          echo "VCPKG_ROOT=$env:USERPROFILE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$env:USERPROFILE\vcpkg" | Out-File -FilePath $env:GITHUB_PATH -Append
          
          $pkgs = @(
            'libvpx:x64-windows-static',
            'libyuv:x64-windows-static',
            'opus:x64-windows-static',
            'aom:x64-windows-static'
          )
          
          foreach ($pkg in $pkgs) {
            Write-Host "Installing $pkg..."
            & $env:USERPROFILE\vcpkg\vcpkg.exe install $pkg
          }
          
          Write-Host "✅ vcpkg dependencies installed"

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
            cargo-

      - name: Cache vcpkg installed
        uses: actions/cache@v4
        with:
          path: ${{ env.USERPROFILE }}\vcpkg\installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('.github/workflows/**', 'vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
            vcpkg-

      - name: Download Sciter DLL
        run: |
          New-Item -ItemType Directory -Force -Path target\release | Out-Null
          Write-Host "Downloading Sciter DLL..."
          Invoke-WebRequest -UseBasicParsing -Uri https://raw.githubusercontent.com/c-smile/sciter-sdk/master/bin.win/x64/sciter.dll -OutFile target\release\sciter.dll
          if (Test-Path target\release\sciter.dll) {
            Write-Host "✅ Sciter DLL downloaded successfully"
          } else {
            Write-Host "⚠️ Failed to download Sciter DLL"
          }

      - name: Set custom server ID/Key/Relay from Secrets
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          RELAY_SERVER: ${{ secrets.RELAY_SERVER }}
        run: |
          # Use defaults if secrets not provided
          if (-not $env:RENDEZVOUS_SERVER) { $env:RENDEZVOUS_SERVER = $env:DEFAULT_RENDEZVOUS_SERVER }
          if (-not $env:RS_PUB_KEY) { $env:RS_PUB_KEY = $env:DEFAULT_RS_PUB_KEY }
          if (-not $env:RELAY_SERVER) { $env:RELAY_SERVER = $env:DEFAULT_RELAY_SERVER }
          
          Write-Host "Using RENDEZVOUS_SERVER: $env:RENDEZVOUS_SERVER"
          Write-Host "Using RELAY_SERVER: $env:RELAY_SERVER"
          Write-Host "Using RS_PUB_KEY: [HIDDEN]"
          
          # Find and update config.rs files
          $configFiles = Get-ChildItem -Recurse -File -Path libs -Filter config.rs
          if ($configFiles.Count -eq 0) {
            Write-Host "⚠️ No config.rs files found in libs directory"
            # Try looking in src directory
            $configFiles = Get-ChildItem -Recurse -File -Path src -Filter config.rs
          }
          
          if ($configFiles.Count -eq 0) {
            Write-Error "❌ config.rs not found. Repository structure may have changed."
            exit 1
          }
          
          foreach ($configFile in $configFiles) {
            Write-Host "Updating: $($configFile.FullName)"
            $content = Get-Content $configFile.FullName -Raw -Encoding UTF8
            
            # Update RENDEZVOUS_SERVER
            $content = $content -replace '(?m)^(\s*pub\s+const\s+DEFAULT_RENDEZVOUS_SERVER\s*:\s*&str\s*=\s*)"[^"]*"', "`$1`"$env:RENDEZVOUS_SERVER`""
            # Update RS_PUB_KEY
            $content = $content -replace '(?m)^(\s*pub\s+const\s+DEFAULT_RS_PUB_KEY\s*:\s*&str\s*=\s*)"[^"]*"', "`$1`"$env:RS_PUB_KEY`""
            # Update RELAY_SERVER
            $content = $content -replace '(?m)^(\s*pub\s+const\s+DEFAULT_RELAY_SERVER\s*:\s*&str\s*=\s*)"[^"]*"', "`$1`"$env:RELAY_SERVER`""
            
            Set-Content $configFile.FullName $content -Encoding UTF8 -NoNewline
            Write-Host "✅ Updated: $($configFile.Name)"
          }

      - name: Build RustDesk (release, x64)
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          LIBCLANG_PATH: ${{ env.LIBCLANG_PATH }}
        run: |
          Write-Host "Starting build process..."
          Write-Host "VCPKG_ROOT: $env:VCPKG_ROOT"
          Write-Host "LIBCLANG_PATH: $env:LIBCLANG_PATH"
          
          # Build the project
          cargo build --release --target x86_64-pc-windows-msvc
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ Build failed with exit code: $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          
          Write-Host "✅ Build completed successfully"

      - name: Rename binary with custom server info
        if: success()
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER || env.DEFAULT_RENDEZVOUS_SERVER }}
        run: |
          $exePath = "target\x86_64-pc-windows-msvc\release\rustdesk.exe"
          if (Test-Path $exePath) {
            $safeHost = ($env:RENDEZVOUS_SERVER -replace '[^a-zA-Z0-9.-]', '-')
            $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
            $outName = "rustdesk-host=$safeHost-$timestamp.exe"
            Copy-Item $exePath $outName
            Write-Host "✅ Created: $outName"
          } else {
            Write-Host "⚠️ rustdesk.exe not found at expected location"
          }

      - name: List build artifacts
        if: success()
        run: |
          Write-Host "Build artifacts:"
          Write-Host "=================="
          if (Test-Path "target\x86_64-pc-windows-msvc\release\rustdesk.exe") {
            $file = Get-Item "target\x86_64-pc-windows-msvc\release\rustdesk.exe"
            Write-Host "rustdesk.exe: $([math]::Round($file.Length/1MB,2)) MB"
          }
          if (Test-Path "target\release\sciter.dll") {
            $file = Get-Item "target\release\sciter.dll"
            Write-Host "sciter.dll: $([math]::Round($file.Length/1MB,2)) MB"
          }
          Get-ChildItem "rustdesk-host=*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "$($_.Name): $([math]::Round($_.Length/1MB,2)) MB"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64-custom
          path: |
            target\x86_64-pc-windows-msvc\release\rustdesk.exe
            rustdesk-host=*.exe
            target\release\sciter.dll
          if-no-files-found: warn
          retention-days: 30
